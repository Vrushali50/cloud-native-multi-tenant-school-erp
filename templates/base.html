<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School ERP</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#f4f6f9;
        }

        .navbar{
            height:60px;
            background:#2d89ef;
            color:white;
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:0 30px;
        }

        .navbar h2{
            font-size:24px;
        }

        .container{
            display:flex;
            height:calc(100vh - 60px);
        }

        .sidebar{
            width:230px;
            background:#34495e;
            color:white;
            padding-top:20px;
        }

        .sidebar a{
            display:block;
            color:white;
            text-decoration:none;
            padding:15px 25px;
            transition:0.3s;
        }

        .sidebar a:hover{
            background:#2d89ef;
        }

        .content{
            flex:1;
            padding:30px;
        }

        .logout-btn{
            color:white;
            text-decoration:none;
        }

        .cards{
    display:flex;
    gap:20px;
    flex-wrap:wrap;
    margin-top:20px;
}

.card{
    width:220px;
    background:white;
    padding:25px;
    border-radius:10px;
    box-shadow:0 5px 15px rgba(0,0,0,0.15);
    text-align:center;
    transition:.3s;
}

.card:hover{
    transform:translateY(-5px);
}

.card h3{
    color:#555;
    margin-bottom:15px;
}

.card h1{
    color:#2d89ef;
    font-size:42px;
}

.icon{
    font-size:40px;
    margin-bottom:15px;
}

.students{
    border-left:6px solid #3498db;
}

.teachers{
    border-left:6px solid #2ecc71;
}

.classes{
    border-left:6px solid #f39c12;
}

.subjects{
    border-left:6px solid #e74c3c;
}

.card{
    position:relative;
    overflow:hidden;
}

.card::after{
    content:"";
    position:absolute;
    right:-30px;
    top:-30px;
    width:100px;
    height:100px;
    background:rgba(45,137,239,.08);
    border-radius:50%;
}

    </style>

</head>

<body>

<div class="navbar">

    <h2>School ERP</h2>

    <a class="logout-btn" href="{% url 'accounts:logout' %}">
        Logout
    </a>

</div>

<div class="container">

    <div class="sidebar">

        <a href="{% url 'accounts:dashboard' %}">🏠 Dashboard</a>

        <a href="{% url 'core:students' %}">👨‍🎓 Students</a>

        <a href="{% url 'core:teachers' %}">👩‍🏫 Teachers</a>

        <a href="#">🏫 Classes</a>

        <a href="#">📚 Subjects</a>

    </div>

    <div class="content">

        {% block content %}

        {% endblock %}

    </div>

</div>

</body>

</html>
