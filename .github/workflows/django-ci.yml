name: Django CI/CD

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  ci:
    name: Run Django CI checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: school_erp_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d school_erp_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: django-ci-secret-key
      DEBUG: "1"
      DB_NAME: school_erp_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: 5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django system check
        run: python manage.py check

      - name: Run database migrations
        run: python manage.py migrate

      - name: Collect static files
        run: python manage.py collectstatic --noinput

    deploy:
    name: Deploy to AWS EC2
    runs-on: self-hosted
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4

      - name: Restart production containers
        run: |
          chmod +x docker-entrypoint.sh
          sed -i 's/\r$//' docker-entrypoint.sh
          docker compose -p school_erp -f docker-compose.prod.yml up --build -d
          docker image prune -f
          docker ps