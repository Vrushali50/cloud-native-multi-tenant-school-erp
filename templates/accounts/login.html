<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School ERP Login</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#f4f7fc;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .login-box{
            width:380px;
            background:white;
            padding:35px;
            border-radius:10px;
            box-shadow:0 5px 20px rgba(0,0,0,0.15);
        }

        h2{
            text-align:center;
            margin-bottom:25px;
            color:#2c3e50;
        }

        label{
            display:block;
            margin-top:15px;
            margin-bottom:5px;
            font-weight:bold;
        }

        input{
            width:100%;
            padding:10px;
            border:1px solid #ccc;
            border-radius:5px;
        }

        button{
            width:100%;
            margin-top:25px;
            padding:12px;
            border:none;
            border-radius:5px;
            background:#2d89ef;
            color:white;
            font-size:16px;
            cursor:pointer;
        }

        button:hover{
            background:#1f6fd1;
        }

        .error-message{
            margin-bottom:15px;
            padding:10px;
            border-radius:5px;
            background:#f8d7da;
            color:#842029;
            text-align:center;
        }
    </style>

</head>

<body>

<div class="login-box">

    <h2>School ERP Login</h2>

    <form method="post">
        {% csrf_token %}

        {% if form.errors %}
            <p class="error-message">
                Username or Password is incorrect.
            </p>
        {% endif %}

        <label for="id_username">Username</label>
        <input
            type="text"
            name="username"
            id="id_username"
            required
            autofocus
        >

        <label for="id_password">Password</label>
        <input
            type="password"
            name="password"
            id="id_password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

</div>

</body>
</html>
