services:
  web:
    build: .
    container_name: school_erp_web
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 1 --timeout 120
    environment:
      DEBUG: "0"
      SECRET_KEY: "django-aws-production-secret-key-change-later"
      DB_NAME: "school_erp_db"
      DB_USER: "postgres"
      DB_PASSWORD: "postgres"
      DB_HOST: "db"
      DB_PORT: "5432"
    depends_on:
      - db
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    restart: always

  db:
    image: postgres:16
    container_name: school_erp_db
    environment:
      POSTGRES_DB: "school_erp_db"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  nginx:
    image: nginx:latest
    container_name: school_erp_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      - web
    restart: always

volumes:
  postgres_data:
  static_volume:
  media_volume: