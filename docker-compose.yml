services:
  web:
    build: .
    container_name: school_erp_web
    command: python manage.py runserver 0.0.0.0:8000
    entrypoint: /app/docker-entrypoint.sh
    ports:
      - "8000:8000"
    environment:
      DEBUG: "1"
      SECRET_KEY: "django-docker-dev-secret-key"
      DB_NAME: "school_erp_db"
      DB_USER: "postgres"
      DB_PASSWORD: "postgres"
      DB_HOST: "db"
      DB_PORT: "5432"
    depends_on:
      - db
    volumes:
      - .:/app

  db:
    image: postgres:16
    container_name: school_erp_db
    environment:
      POSTGRES_DB: "school_erp_db"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: